description: QA, SDET, test automation and quality engineering

# Starting searches. Overridden by `searches:` in config.yaml.
searches:
  - SDET
  - QA Automation
  - Automation Test Engineer
  - Test Automation Framework
  - Quality Engineering

# A job must mention at least one of these or it never reaches scoring.
# This is the "is this even my field" gate.
must_have_any:
  - QA
  - SDET
  - test automation
  - automation testing
  - quality engineering
  - test engineer
  - quality assurance

exclude_title_keywords:
  - intern
  - fresher
  - trainee
  - hardware
  - sales
  - support engineer

# Folded together before matching, so a posting asking for an "Automation
# Tester" scores against a resume that says "Test Automation".
synonyms:
  sdet: software development engineer in test
  qa: quality assurance
  automation testing: test automation
  automation tester: test automation
  test automation engineer: test automation
  restassured: rest assured
  rest-assured: rest assured
  bdd: behaviour driven development
  tdd: test driven development
  e2e: end to end

# Terms recognised in a job description when the posting lists no skill tags.
